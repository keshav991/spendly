{% extends "base.html" %}

{% block title %}Edit Expense — Spendly{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Edit Expense</h1>
            <p class="auth-subtitle">Update the details of your transaction</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('edit_expense', id=expense.id) }}">
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" name="amount"
                           step="0.01" min="0.01" class="form-input"
                           placeholder="0.00" required
                           value="{{ expense.amount }}">
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-input" required>
                        <option value="" disabled>Select a category</option>
                        <option value="Food" {{ 'selected' if expense.category == 'Food' }}>Food</option>
                        <option value="Transport" {{ 'selected' if expense.category == 'Transport' }}>Transport</option>
                        <option value="Bills" {{ 'selected' if expense.category == 'Bills' }}>Bills</option>
                        <option value="Health" {{ 'selected' if expense.category == 'Health' }}>Health</option>
                        <option value="Entertainment" {{ 'selected' if expense.category == 'Entertainment' }}>Entertainment</option>
                        <option value="Shopping" {{ 'selected' if expense.category == 'Shopping' }}>Shopping</option>
                        <option value="Other" {{ 'selected' if expense.category == 'Other' }}>Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" class="form-input"
                           required value="{{ expense.date }}">
                </div>

                <div class="form-group">
                    <label for="description">Description (Optional)</label>
                    <input type="text" id="description" name="description"
                           class="form-input" placeholder="What was this for?"
                           maxlength="200" value="{{ expense.description or '' }}">
                </div>

                <div class="form-actions">
                    <a href="{{ url_for('profile') }}" class="btn-cancel">Cancel</a>
                    <button type="submit" class="btn-submit">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
